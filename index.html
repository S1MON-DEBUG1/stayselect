<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StaySelect – My Hotel Collection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
:root{
  --forest-900:#1a342b; --forest-800:#1e3f33; --forest-700:#254e3f;
  --forest-600:#2e624e; --forest-500:#3f7c63; --forest-100:#dcebe2;
  --cream-100:#faf7ef; --cream-50:#fdfcf8;
  --sand-100:#f0e9dc; --sand-200:#e0d3bd; --sand-300:#cbb89a;
  --taupe-500:#786b5e; --taupe-600:#5f5449;
  --anthracite-800:#141618; --anthracite-700:#1f2224;
  --anthracite-600:#2f3336; --anthracite-400:#73787d;
  --brass-400:#cba94f; --brass-500:#b8933a; --brass-100:#f7efd9;
  --success:#2e7d4f; --success-light:#e6f4ea;
  --warning:#b8860b; --warning-light:#fdf3e0;
  --danger:#b3261e; --danger-light:#fdeaea;
  --info:#1a73e8; --info-light:#e8f0fe;
  --bg:var(--cream-100); --surface:var(--cream-50); --surface-2:var(--sand-100);
  --border:var(--sand-200); --text:var(--anthracite-700); --text-dim:var(--taupe-500);
}
[data-theme="dark"]{
  --bg:#10171a; --surface:#182228; --surface-2:#1f2d33;
  --border:#2a3a42; --text:#e8ecef; --text-dim:#8fa0a8;
  --cream-50:#182228; --cream-100:#10171a; --sand-100:#1f2d33; --sand-200:#2a3a42; --sand-300:#3a4d56;
  --anthracite-800:#e8ecef; --anthracite-700:#d8dfe3; --anthracite-600:#a8b6bd; --anthracite-400:#7a8b93;
  --forest-100:#1e3f33; --forest-700:#3f7c63; --forest-800:#4a9179; --forest-900:#0d1f19;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;color:var(--anthracite-800);font-weight:500;letter-spacing:-0.01em}
h1{font-size:2.4rem;line-height:1.15}
h2{font-size:1.8rem;line-height:1.2}
h3{font-size:1.3rem}
a{color:var(--forest-700);text-decoration:none;transition:color .2s}
a:hover{color:var(--forest-800);text-decoration:underline;text-underline-offset:4px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:1rem;color:var(--text);background:var(--surface);border:1px solid var(--sand-300);border-radius:6px;padding:0.6rem 0.8rem}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--forest-500);box-shadow:0 0 0 2px var(--forest-100)}
input[readonly]{background:var(--sand-100);color:var(--text-dim);cursor:not-allowed}

.app{display:flex;min-height:100vh}
.sidebar{width:260px;background:var(--forest-900);color:#faf7ef;padding:2rem 1.25rem;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:50;overflow-y:auto}
.logo{font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:600;color:#fdfcf8;letter-spacing:0.02em}
.logo-sub{font-size:0.7rem;color:var(--sand-300);text-transform:uppercase;letter-spacing:0.18em;margin:0.25rem 0 2rem}
.nav{display:flex;flex-direction:column;gap:0.15rem;flex:1}
.nav-item{display:flex;align-items:center;gap:0.75rem;padding:0.7rem 0.9rem;border-radius:6px;color:var(--sand-200);font-size:0.9rem;text-align:left;width:100%;transition:all .2s;cursor:pointer}
.nav-item:hover{background:var(--forest-800);color:#fdfcf8}
.nav-item.active{background:var(--forest-700);color:#fdfcf8;font-weight:500}
.nav-icon{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;flex-shrink:0}
.nav-divider{height:1px;background:var(--forest-800);margin:0.75rem 0}
.sidebar-footer{font-size:0.7rem;color:var(--sand-300);padding-top:1rem;border-top:1px solid var(--forest-800);margin-top:1rem}
.sidebar-footer button{color:var(--sand-200);font-size:0.75rem;text-align:left;padding:0.3rem 0;display:flex;align-items:center;gap:0.5rem;width:100%}
.sidebar-footer button:hover{color:#fdfcf8}

.main{flex:1;margin-left:260px;padding:2.5rem 3rem 4rem;max-width:1600px}
.page-header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:1.5rem;margin-bottom:2.5rem;padding-bottom:1.5rem;border-bottom:1px solid var(--border)}
.page-title small{display:block;font-family:'Inter',sans-serif;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.18em;color:var(--text-dim);font-weight:500;margin-bottom:0.5rem}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:0.5rem;padding:0.65rem 1.25rem;border-radius:6px;font-size:0.875rem;font-weight:500;letter-spacing:0.01em;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--forest-700);color:#fdfcf8}
.btn-primary:hover{background:var(--forest-800)}
.btn-secondary{background:transparent;border:1px solid var(--sand-300);color:var(--text)}
.btn-secondary:hover{background:var(--sand-100)}
.btn-ghost{background:transparent;color:var(--text-dim)}
.btn-ghost:hover{background:var(--sand-100);color:var(--text)}
.btn-danger{background:var(--danger);color:white}
.btn-danger:hover{background:#8a1c16}
.btn-sm{padding:0.4rem 0.85rem;font-size:0.8rem}

.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 1px 2px rgba(20,22,24,0.04);transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 4px 16px rgba(20,22,24,0.08)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-bottom:2.5rem}
.stat-card{padding:1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.stat-label{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--text-dim);font-weight:500;margin-bottom:0.75rem}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:2.2rem;color:var(--forest-800);line-height:1;font-weight:500}
.stat-sub{font-size:0.8rem;color:var(--text-dim);margin-top:0.5rem}

.properties-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.5rem}
.property-card{overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.property-image{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--sand-100),var(--sand-200))}
.property-image .initials{font-family:'Cormorant Garamond',serif;font-size:3rem;color:var(--taupe-500);text-align:center;padding:1rem;line-height:1;font-weight:600;letter-spacing:0.05em}
.property-image img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.property-image .flag{position:absolute;top:0.75rem;left:0.75rem;background:rgba(253,252,248,0.95);color:var(--forest-800);padding:0.2rem 0.6rem;border-radius:20px;font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;z-index:2}
[data-theme="dark"] .property-image .flag{background:rgba(24,34,40,0.95);color:#fdfcf8}
.image-count{position:absolute;bottom:0.75rem;right:0.75rem;background:rgba(20,22,24,0.75);color:white;padding:0.2rem 0.6rem;border-radius:20px;font-size:0.7rem;font-weight:600;z-index:2;display:flex;align-items:center;gap:0.3rem}
.fav-badge{position:absolute;top:0.75rem;right:0.75rem;background:rgba(253,252,248,0.95);color:var(--brass-500);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;border:1px solid var(--border);cursor:pointer;transition:transform .2s;z-index:2}
.fav-badge:hover{transform:scale(1.1)}
.fav-badge.active{color:var(--brass-500)}
[data-theme="dark"] .fav-badge{background:rgba(24,34,40,0.95)}
.property-body{padding:1.25rem;flex:1;display:flex;flex-direction:column;gap:0.75rem}
.property-name{font-size:1.2rem;line-height:1.3;font-family:'Cormorant Garamond',serif;color:var(--anthracite-800);font-weight:600}
.property-loc{font-size:0.8rem;color:var(--text-dim)}
.property-price{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:0.75rem;border-top:1px solid var(--sand-100)}
.price-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.15em;color:var(--text-dim)}
.price-value{font-family:'Cormorant Garamond',serif;font-size:1.35rem;color:var(--forest-800);font-weight:600}
.price-total{font-size:0.75rem;color:var(--forest-700);font-weight:500;margin-top:0.15rem}

.badge-tag{background:var(--forest-100);color:var(--forest-800);border-radius:4px;padding:0.1rem 0.5rem;font-size:0.7rem;font-weight:500;display:inline-block}
[data-theme="dark"] .badge-tag{background:var(--forest-100);color:var(--forest-800)}

.filter-bar{display:flex;flex-wrap:wrap;gap:0.75rem;align-items:center;padding:1rem 1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:1.5rem}
.filter-bar input,.filter-bar select{padding:0.5rem 0.75rem;font-size:0.85rem;min-width:120px}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:0.85rem;min-width:900px}
th,td{padding:0.85rem 1rem;text-align:left;border-bottom:1px solid var(--sand-100);vertical-align:top}
th{background:var(--sand-100);font-weight:600;font-size:0.7rem;text-transform:uppercase;letter-spacing:0.1em;color:var(--taupe-600);position:sticky;top:0;cursor:pointer;user-select:none}
th:hover{background:var(--sand-200)}
tbody tr:hover{background:var(--sand-100)}
tbody tr:last-child td{border-bottom:none}
.sort-arrow{color:var(--brass-500);margin-left:0.25rem;font-size:0.7rem}
.total-cell{font-weight:600;color:var(--forest-800)}
.nights-badge{display:inline-block;background:var(--forest-100);color:var(--forest-800);padding:0.1rem 0.55rem;border-radius:12px;font-size:0.75rem;font-weight:600}

.modal-overlay{position:fixed;inset:0;background:rgba(20,22,24,0.55);display:flex;align-items:center;justify-content:center;padding:2rem;z-index:100;backdrop-filter:blur(3px)}
.modal{background:var(--surface);border-radius:12px;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;padding:2rem;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.modal h2{margin-bottom:1.5rem}
.form-group{margin-bottom:1.25rem}
.form-group label{display:block;font-size:0.8rem;font-weight:500;color:var(--anthracite-600);margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.06em}
.form-group input,.form-group select,.form-group textarea{width:100%}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}
.form-hint{font-size:0.75rem;color:var(--text-dim);margin-top:0.35rem}
.modal-actions{display:flex;gap:0.75rem;justify-content:flex-end;margin-top:1.75rem;padding-top:1.25rem;border-top:1px solid var(--border)}

.empty-state{text-align:center;padding:4rem 2rem;background:var(--surface);border:1px dashed var(--sand-300);border-radius:10px}
.empty-state h3{margin-bottom:0.75rem;color:var(--taupe-600)}
.empty-state p{color:var(--text-dim);margin-bottom:1.5rem}

.search-panel{background:var(--forest-900);color:#faf7ef;border-radius:12px;padding:1.75rem 2rem;margin-bottom:2rem}
.search-panel h3{color:#fdfcf8;font-size:1.2rem;font-family:'Cormorant Garamond',serif;margin-bottom:1.25rem;font-weight:500}
.search-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;align-items:end}
.search-field label{display:block;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--sand-300);margin-bottom:0.4rem;font-weight:500}
.search-field input,.search-field select{width:100%;padding:0.6rem 0.75rem;border:1px solid var(--forest-700);background:var(--forest-800);color:#fdfcf8;border-radius:5px;font-size:0.9rem}
.search-field input:focus,.search-field select:focus{border-color:var(--brass-400);box-shadow:0 0 0 2px rgba(203,169,79,0.25)}
.search-field select option{background:var(--forest-800);color:#fdfcf8}
.search-field input[readonly]{background:var(--forest-700);color:var(--sand-200);cursor:not-allowed}

.context-bar{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-end;padding:1.25rem 1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:1.5rem}
.context-bar .ctx-field{display:flex;flex-direction:column;gap:0.3rem;min-width:130px}
.context-bar .ctx-field label{font-size:0.68rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-dim);font-weight:600}
.context-bar .ctx-field input{padding:0.5rem 0.7rem;font-size:0.9rem}
.context-bar .ctx-toggle{display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;cursor:pointer;padding:0.55rem 0.75rem;border:1px solid var(--sand-300);border-radius:6px;background:var(--surface)}
.context-bar .ctx-toggle:hover{background:var(--sand-100)}
.context-bar .ctx-toggle input{cursor:pointer;accent-color:var(--forest-700)}
.context-bar .ctx-summary{margin-left:auto;font-size:0.8rem;color:var(--text-dim);text-align:right}
.context-bar .ctx-summary strong{color:var(--forest-800)}

.detail-header{background:var(--forest-900);color:#faf7ef;padding:3rem 2.5rem;border-radius:12px;margin-bottom:2rem}
.detail-header h1{color:#fdfcf8;font-size:2.4rem;margin-bottom:0.5rem}
.detail-header .loc{color:var(--sand-300);font-size:0.95rem}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1.25rem;margin-bottom:2rem}
.detail-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1.25rem}
.detail-block h4{font-size:0.7rem;text-transform:uppercase;letter-spacing:0.14em;color:var(--text-dim);font-weight:600;margin-bottom:0.75rem;font-family:'Inter',sans-serif}
.detail-block .value{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--forest-800);font-weight:600}
.detail-block .value-sm{font-size:1rem;color:var(--text);font-weight:400;font-family:'Inter',sans-serif}

/* === GALERIE === */
.gallery{margin-bottom:1.5rem;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface)}
.gallery-main{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--sand-100),var(--sand-200));overflow:hidden}
.gallery-main img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;background:rgba(253,252,248,0.92);color:var(--forest-900);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-family:'Cormorant Garamond',serif;cursor:pointer;transition:all .2s;box-shadow:0 2px 8px rgba(0,0,0,0.15);line-height:1;padding-bottom:4px}
.gallery-nav:hover{background:white;transform:translateY(-50%) scale(1.08)}
.gallery-prev{left:0.75rem}
.gallery-next{right:0.75rem}
.gallery-counter{position:absolute;bottom:0.75rem;left:0.75rem;background:rgba(20,22,24,0.7);color:white;padding:0.25rem 0.7rem;border-radius:20px;font-size:0.75rem;font-weight:600;letter-spacing:0.05em}
.gallery-delete{position:absolute;top:0.75rem;right:0.75rem;background:rgba(179,38,30,0.9);color:white;width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.gallery-delete:hover{background:var(--danger);transform:scale(1.08)}
.gallery-thumbs{display:flex;gap:0.4rem;padding:0.6rem;overflow-x:auto;background:var(--sand-100);scrollbar-width:thin}
.gallery-thumbs::-webkit-scrollbar{height:6px}
.gallery-thumbs::-webkit-scrollbar-thumb{background:var(--sand-300);border-radius:3px}
.gallery-thumb{flex:0 0 70px;height:52px;border-radius:6px;overflow:hidden;cursor:pointer;opacity:0.55;transition:all .2s;border:2px solid transparent}
.gallery-thumb:hover{opacity:0.85}
.gallery-thumb.active{opacity:1;border-color:var(--brass-400)}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;display:block}

/* === LIGHTBOX === */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:300;display:flex;align-items:center;justify-content:center;padding:2rem}
.lightbox img{max-width:95vw;max-height:88vh;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,0.5);border-radius:4px}
.lightbox-close{position:absolute;top:1.5rem;right:1.5rem;color:white;font-size:2.4rem;cursor:pointer;opacity:0.7;transition:opacity .2s;line-height:1;padding:0.5rem}
.lightbox-close:hover{opacity:1}
.lightbox-nav{position:absolute;top:50%;transform:translateY(-50%);color:white;font-size:3.5rem;cursor:pointer;opacity:0.55;transition:opacity .2s;font-family:'Cormorant Garamond',serif;padding:1rem;line-height:1}
.lightbox-nav:hover{opacity:1}
.lightbox-prev{left:1.5rem}
.lightbox-next{right:1.5rem}
.lightbox-counter{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);color:white;font-size:0.9rem;letter-spacing:0.15em;font-weight:500}

/* === UPLOAD === */
.image-upload{margin-top:0.5rem}
.drop-zone{border:2px dashed var(--sand-300);border-radius:10px;padding:1.75rem 1rem;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface)}
.drop-zone:hover{border-color:var(--forest-500);background:var(--sand-100)}
.drop-zone.dragover{border-color:var(--forest-600);background:var(--forest-100);color:var(--forest-800)}
.drop-zone svg{color:var(--taupe-500);margin-bottom:0.25rem}
.upload-hint{font-size:0.75rem;color:var(--text-dim);margin-top:0.25rem}

.toast{position:fixed;bottom:2rem;right:2rem;z-index:400;background:var(--forest-900);color:#fdfcf8;padding:0.9rem 1.4rem;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,0.25);font-size:0.9rem;opacity:0;transform:translateY(20px);transition:all .3s;pointer-events:none;max-width:360px}
.toast.show{opacity:1;transform:translateY(0)}

.compare-selector{display:flex;flex-wrap:wrap;gap:0.75rem;margin-bottom:1.5rem;padding:1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px}
.compare-chip{display:inline-flex;align-items:center;gap:0.5rem;padding:0.4rem 0.75rem;background:var(--sand-100);border-radius:20px;font-size:0.8rem;cursor:pointer;transition:all .2s;border:1px solid transparent}
.compare-chip:hover{background:var(--sand-200)}
.compare-chip.selected{background:var(--forest-700);color:#fdfcf8;border-color:var(--forest-800)}

.score-pill{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:1.1rem;color:white;background:var(--forest-700)}
.score-pill.high{background:var(--success)}
.score-pill.mid{background:var(--brass-500)}
.score-pill.low{background:var(--taupe-500)}

.collection-chip{display:inline-flex;align-items:center;gap:0.4rem;padding:0.3rem 0.7rem;background:var(--sand-100);border-radius:16px;font-size:0.75rem;cursor:pointer;border:1px solid transparent}
.collection-chip.active{background:var(--forest-700);color:#fdfcf8}
.collection-chip .del{opacity:0.6;font-size:0.9rem}
.collection-chip .del:hover{opacity:1;color:var(--danger)}

canvas.chart{width:100%;height:200px;display:block}
#map{height:420px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}

.tabs{display:flex;gap:0.25rem;border-bottom:1px solid var(--border);margin-bottom:1.5rem;overflow-x:auto}
.tab{padding:0.75rem 1.25rem;font-size:0.9rem;color:var(--text-dim);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--text)}
.tab.active{color:var(--forest-700);border-bottom-color:var(--forest-700)}

.import-row{display:flex;align-items:center;gap:0.75rem;padding:0.65rem 0.9rem;border:1px solid var(--border);border-radius:6px;margin-bottom:0.5rem;font-size:0.85rem;background:var(--surface)}
.import-row .status{flex-shrink:0;width:70px;font-size:0.7rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em}
.import-row .status.pending{color:var(--info)}
.import-row .status.duplicate{color:var(--warning)}
.import-row .status.success{color:var(--success)}
.import-row .status.failed{color:var(--danger)}

/* ============ IMAGE STORAGE (IndexedDB) ============ */
const imgDB = (() => {
  const DB_NAME='stayselect_images', STORE='images';
  let dbPromise=null;
  function open(){
    if(dbPromise) return dbPromise;
    dbPromise=new Promise((res,rej)=>{
      const r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains(STORE)){
          const s=db.createObjectStore(STORE,{keyPath:'id'});
          s.createIndex('property_id','property_id',{unique:false});
        }
      };
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error);
    });
    return dbPromise;
  }
  async function add(rec){
    const db=await open();
    return new Promise((res,rej)=>{
      const tx=db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).put(rec);
      tx.oncomplete=()=>res(rec);
      tx.onerror=()=>rej(tx.error);
    });
  }
  async function getByProperty(pid){
    const db=await open();
    return new Promise((res,rej)=>{
      const tx=db.transaction(STORE,'readonly');
      const idx=tx.objectStore(STORE).index('property_id');
      const r=idx.getAll(pid);
      r.onsuccess=()=>{
        const arr=r.result||[];
        arr.sort((a,b)=>(a.order||0)-(b.order||0));
        res(arr);
      };
      r.onerror=()=>rej(r.error);
    });
  }
  async function del(id){
    const db=await open();
    return new Promise((res,rej)=>{
      const tx=db.transaction(STORE,'readwrite');
      tx.objectStore(STORE).delete(id);
      tx.oncomplete=()=>res();
      tx.onerror=()=>rej(tx.error);
    });
  }
  async function delByProperty(pid){
    const arr=await getByProperty(pid);
    for(const a of arr) await del(a.id);
  }
  return {add,getByProperty,del,delByProperty};
})();

const imageCache = new Map();

async function loadImages(propertyId){
  if(imageCache.has(propertyId)) return imageCache.get(propertyId);
  const p = state.properties.find(x=>x.id===propertyId);
  const external = (p?.image_urls||[]).map(url=>({id:'ext:'+url,url,name:url,isExternal:true}));
  const records = await imgDB.getByProperty(propertyId);
  const internal = records.map(r=>({id:r.id,name:r.name,isExternal:false,url:URL.createObjectURL(r.blob),blob:r.blob}));
  const all = [...internal,...external];
  imageCache.set(propertyId,all);
  return all;
}
function clearImageCache(pid){
  if(!imageCache.has(pid)) return;
  const arr=imageCache.get(pid);
  arr.forEach(u=>{ if(!u.isExternal && u.url.startsWith('blob:')) URL.revokeObjectURL(u.url); });
  imageCache.delete(pid);
}
function clearAllImageCache(){
  for(const pid of imageCache.keys()) clearImageCache(pid);
}

async function compressImage(file,maxDim=1600,quality=0.82){
  if(!file.type.startsWith('image/')) throw new Error('Kein Bild');
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      try{
        let {width,height}=img;
        if(width>maxDim||height>maxDim){
          const ratio=Math.min(maxDim/width,maxDim/height);
          width=Math.round(width*ratio);height=Math.round(height*ratio);
        }
        const canvas=document.createElement('canvas');
        canvas.width=width;canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        canvas.toBlob(b=>b?res(b):rej(new Error('Kompression fehlgeschlagen')),'image/jpeg',quality);
      }catch(e){rej(e);}
    };
    img.onerror=()=>rej(new Error('Bild konnte nicht geladen werden'));
    img.src=URL.createObjectURL(file);
  });
}

async function handleFiles(files,propertyId){
  const valid = files.filter(f=>f.type.startsWith('image/'));
  if(!valid.length){ toast('Keine Bilddateien ausgewählt'); return; }
  toast(`${valid.length} Bild${valid.length>1?'er':''} wird verarbeitet…`);
  const existing = await imgDB.getByProperty(propertyId);
  let order = existing.length;
  let ok=0, fail=0;
  for(const file of valid){
    try{
      if(file.size>25*1024*1024){ fail++; continue; }
      const blob = await compressImage(file);
      await imgDB.add({
        id:'img-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),
        property_id:propertyId, order:order++, blob,
        name:file.name, type:'image/jpeg', size:blob.size,
        created_at:new Date().toISOString()
      });
      ok++;
    }catch(e){ console.error(e); fail++; }
  }
  clearImageCache(propertyId);
  await loadImages(propertyId);
  render();
  if(ok) toast(`${ok} Bild${ok>1?'er':''} hinzugefügt${fail?`, ${fail} fehlgeschlagen`:''}`);
  else toast('Keine Bilder hinzugefügt');
}

async function handleDrop(event,propertyId){
  event.preventDefault();
  event.currentTarget.classList.remove('dragover');
  const files = Array.from(event.dataTransfer.files||[]);
  await handleFiles(files,propertyId);
}
async function handleFileSelect(event,propertyId){
  const files = Array.from(event.target.files||[]);
  await handleFiles(files,propertyId);
  event.target.value='';
}
function addImageFromUrl(propertyId){
  const input = document.getElementById('imageUrlInput-'+propertyId);
  if(!input) return;
  const url = input.value.trim();
  if(!url) return;
  if(!/^https?:\/\//i.test(url)){ toast('Ungültige URL'); return; }
  const p = state.properties.find(x=>x.id===propertyId);
  if(!p) return;
  if(!p.image_urls) p.image_urls=[];
  p.image_urls.push(url);
  save();
  clearImageCache(propertyId);
  loadImages(propertyId).then(()=>render());
  toast('Bild-URL hinzugefügt');
}
async function deleteImage(propertyId,imageId,isExternal){
  if(!confirm('Bild wirklich löschen?')) return;
  if(isExternal){
    const p = state.properties.find(x=>x.id===propertyId);
    if(p && p.image_urls){
      const url = imageId.replace(/^ext:/,'');
      p.image_urls = p.image_urls.filter(u=>u!==url);
      save();
    }
  } else {
    await imgDB.del(imageId);
  }
  clearImageCache(propertyId);
  await loadImages(propertyId);
  state.galleryIndex[propertyId]=0;
  render();
  toast('Bild gelöscht');
}

/* ============ Galerie / Lightbox ============ */
function galleryNav(propertyId, delta){
  const images = imageCache.get(propertyId)||[];
  if(!images.length) return;
  const cur = state.galleryIndex[propertyId]||0;
  const next = (cur+delta+images.length)%images.length;
  state.galleryIndex[propertyId]=next;
  updateGalleryDOM(propertyId);
}
function galleryGoto(propertyId,index){
  state.galleryIndex[propertyId]=index;
  updateGalleryDOM(propertyId);
}
function updateGalleryDOM(propertyId){
  const el = document.querySelector(`.gallery[data-pid="${propertyId}"]`);
  if(!el) return;
  const images = imageCache.get(propertyId)||[];
  const cur = state.galleryIndex[propertyId]||0;
  const img = images[cur];
  if(!img) return;
  const mainImg = el.querySelector('.gallery-main img');
  if(mainImg) mainImg.src = img.url;
  const counter = el.querySelector('.gallery-counter');
  if(counter) counter.textContent = `${cur+1} / ${images.length}`;
  el.querySelectorAll('.gallery-thumb').forEach((t,i)=>t.classList.toggle('active',i===cur));
}
function openLightbox(propertyId,index){
  const images = imageCache.get(propertyId)||[];
  if(!images.length) return;
  state.lightbox = {propertyId,index};
  const lb = document.createElement('div');
  lb.className='lightbox';
  lb.id='lightbox';
  lb.innerHTML = `
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    ${images.length>1?`<button class="lightbox-nav lightbox-prev" onclick="lightboxNav(-1)">‹</button>`:''}
    <img src="${images[index].url}" alt="" />
    ${images.length>1?`<button class="lightbox-nav lightbox-next" onclick="lightboxNav(1)">›</button>`:''}
    <div class="lightbox-counter">${index+1} / ${images.length}</div>
  `;
  lb.onclick = e=>{ if(e.target===lb) closeLightbox(); };
  document.body.appendChild(lb);
}
function closeLightbox(){
  const lb=document.getElementById('lightbox');
  if(lb) lb.remove();
  state.lightbox=null;
}
function lightboxNav(delta){
  if(!state.lightbox) return;
  const images = imageCache.get(state.lightbox.propertyId)||[];
  if(!images.length) return;
  const n = (state.lightbox.index+delta+images.length)%images.length;
  state.lightbox.index = n;
  const img = document.querySelector('#lightbox img');
  if(img) img.src = images[n].url;
  const c = document.querySelector('#lightbox .lightbox-counter');
  if(c) c.textContent = `${n+1} / ${images.length}`;
}
document.addEventListener('keydown', e=>{
  if(state.lightbox){
    if(e.key==='Escape') closeLightbox();
    else if(e.key==='ArrowLeft') lightboxNav(-1);
    else if(e.key==='ArrowRight') lightboxNav(1);
    return;
  }
  if(state.currentView==='detail' && document.querySelector('.gallery')){
    if(e.key==='ArrowLeft') galleryNav(state.currentId,-1);
    else if(e.key==='ArrowRight') galleryNav(state.currentId,1);
  }
});

/* ============ Galerie-Renderer ============ */
function renderGallery(propertyId){
  const images = imageCache.get(propertyId)||[];
  if(!images.length){
    return `<div class="gallery"><div class="gallery-main"><div style="display:flex;height:100%;align-items:center;justify-content:center;color:var(--taupe-500);font-size:0.9rem">Noch keine Bilder – unten hochladen</div></div></div>`;
  }
  const cur = state.galleryIndex[propertyId]||0;
  const img = images[cur];
  return `
    <div class="gallery" data-pid="${propertyId}">
      <div class="gallery-main">
        <img src="${img.url}" alt="" onclick="openLightbox('${propertyId}',${cur})" />
        ${images.length>1?`
          <button class="gallery-nav gallery-prev" onclick="event.stopPropagation();galleryNav('${propertyId}',-1)" aria-label="Zurück">‹</button>
          <button class="gallery-nav gallery-next" onclick="event.stopPropagation();galleryNav('${propertyId}',1)" aria-label="Weiter">›</button>
        `:''}
        <div class="gallery-counter">${cur+1} / ${images.length}</div>
        <button class="gallery-delete" onclick="event.stopPropagation();deleteImage('${propertyId}','${img.id}',${img.isExternal})" title="Bild löschen">×</button>
      </div>
      ${images.length>1?`
        <div class="gallery-thumbs">
          ${images.map((im,i)=>`
            <div class="gallery-thumb ${i===cur?'active':''}" onclick="galleryGoto('${propertyId}',${i})">
              <img src="${im.url}" alt="" />
            </div>
          `).join('')}
        </div>
      `:''}
    </div>
  `;
}

function renderImageUpload(propertyId){
  return `
    <div class="detail-block image-upload" style="margin-bottom:1.5rem">

/* ============ Utilities ============ */
function uid(){ return 'p-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function escapeHtml(s){
  if(s==null) return '';
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtPrice(v,c){
  if(v==null||isNaN(v)) return '—';
  try{ return new Intl.NumberFormat('de-DE',{style:'currency',currency:c||'EUR',maximumFractionDigits:0}).format(v); }
  catch{ return v+' '+(c||'EUR'); }
}
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('de-DE',{year:'numeric',month:'short',day:'numeric'}); }catch{ return d; } }
function fmtDateShort(d){ if(!d) return '—'; try{ return new Date(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch{ return d; } }
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),2800);
}
function typeLabel(t){
  const m={hotel:'Hotel',boutique_hotel:'Boutique-Hotel',chalet:'Chalet',ferienhaus:'Ferienhaus',wellness_resort:'Wellness-Resort',apartment:'Apartment',pension:'Pension',gasthof:'Gasthof',other:'Unterkunft'};
  return m[t]||'Unterkunft';
}
function mealLabel(m){
  const map={room_only:'Ohne Verpflegung',breakfast:'Frühstück',half_board:'Halbpension',full_board:'Vollpension',all_inclusive:'All Inclusive',unknown:'Unbekannt'};
  return map[m]||'Unbekannt';
}
function initials(name){ return (name||'').split(/\s+/).filter(Boolean).slice(0,3).map(w=>w[0]).join('').toUpperCase(); }
function providerLabel(p){
  const m={official:'Offizielle Website',booking:'Booking.com',airbnb:'Airbnb',escapio:'Escapio',simplebooking:'SimpleBooking',onepagebooking:'OnePageBooking',huettenland:'Hüttenland',manual:'Manuell'};
  return m[p]||p||'Unbekannt';
}
function nightsBetween(ci,co){
  if(!ci||!co) return null;
  try{ const n=Math.round((new Date(co)-new Date(ci))/86400000); return n>0?n:null; }catch{ return null; }
}
function effectiveBooking(p){
  const ctx=state.compareContext, useOwn=ctx.usePropertyValues;
  const checkin=(useOwn&&p.booking_checkin)?p.booking_checkin:(ctx.checkIn||p.booking_checkin||null);
  const checkout=(useOwn&&p.booking_checkout)?p.booking_checkout:(ctx.checkOut||p.booking_checkout||null);
  const nights=nightsBetween(checkin,checkout);
  let source='leer';
  if(useOwn&&p.booking_checkin&&p.booking_checkout) source='eigen';
  else if(ctx.checkIn&&ctx.checkOut) source='kontext';
  return {checkin,checkout,nights,source};
}
function totalForProperty(p){
  const b=effectiveBooking(p);
  if(p.base_price==null||b.nights==null) return null;
  return Math.round(p.base_price*b.nights*100)/100;
}

/* ============ Persistence ============ */
function migrateProperty(p){
  if(!p.price_history) p.price_history=[];
  if(!p.collections) p.collections=[];
  if(!p.image_urls) p.image_urls=[];
  if(p.is_favorite==null) p.is_favorite=false;
  if(p.sauna_types==null) p.sauna_types=[];
  if(p.amenities==null) p.amenities=[];
  if(p.spa==null) p.spa=false;
  if(p.booking_checkin===undefined){
    if(p.booking_date){
      p.booking_checkin=p.booking_date;
      if(p.nights){
        const d=new Date(p.booking_date); d.setDate(d.getDate()+Number(p.nights));
        p.booking_checkout=d.toISOString().slice(0,10);
      } else p.booking_checkout=null;
    } else { p.booking_checkin=null; p.booking_checkout=null; }
  }
  if(p.booking_checkout===undefined) p.booking_checkout=null;
  delete p.booking_date; delete p.nights;
  return p;
}
function load(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d=JSON.parse(raw);
      if(Array.isArray(d.properties)) state.properties=d.properties.map(migrateProperty);
      if(Array.isArray(d.collections)) state.collections=d.collections;
      if(d.lastSearch) state.lastSearch=d.lastSearch;
      if(d.compareContext){ state.compareContext={...state.compareContext,...d.compareContext}; if(state.compareContext.nights) delete state.compareContext.nights; }
    } else {
      state.properties=JSON.parse(JSON.stringify(SEED_PROPERTIES)).map(migrateProperty);
      save();
    }
  }catch(e){ console.warn(e); state.properties=JSON.parse(JSON.stringify(SEED_PROPERTIES)).map(migrateProperty); }
  try{
    const raw=localStorage.getItem(SETTINGS_KEY);
    if(raw) state.settings={...DEFAULT_SETTINGS,...JSON.parse(raw)};
  }catch(e){}
  applyTheme();
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify({
    properties:state.properties, collections:state.collections,
    lastSearch:state.lastSearch, compareContext:state.compareContext
  })); }catch(e){ toast('Speichern fehlgeschlagen: '+e.message); }
}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY,JSON.stringify(state.settings)); }catch(e){} }

/* ============ Theme ============ */
function applyTheme(){
  document.documentElement.setAttribute('data-theme',state.settings.theme||'light');
  const lbl=document.getElementById('themeLabel');
  if(lbl) lbl.textContent=(state.settings.theme==='dark')?'Light Mode':'Dark Mode';
}
function toggleTheme(){
  state.settings.theme=(state.settings.theme==='dark')?'light':'dark';
  saveSettings(); applyTheme();
}

/* ============ Scoring ============ */
function computeScore(p){
  const w=state.settings.weights;
  const prices=state.properties.map(x=>x.base_price).filter(v=>v!=null);
  let priceScore=null;
  if(p.base_price!=null&&prices.length>1){
    const min=Math.min(...prices),max=Math.max(...prices);
    priceScore=max>min?100-((p.base_price-min)/(max-min))*100:100;
  }
  const dinnerScore=p.dinner_score!=null?((p.dinner_score-1)/4)*100:null;
  const saunaCount=(p.sauna_types||[]).length;
  const spaScore=p.spa?Math.min(100,40+saunaCount*12):0;
  const qualityScore=p.personal_rating!=null?(p.personal_rating/5)*100:60;
  const personalScore=(p.is_favorite?50:0)+(p.personal_rating!=null?(p.personal_rating/5)*50:0);
  const parts=[];
  if(priceScore!=null) parts.push([priceScore,w.price_value]);
  if(dinnerScore!=null) parts.push([dinnerScore,w.dinner_quality]);
  parts.push([spaScore,w.spa_wellness]);
  parts.push([qualityScore,w.property_quality]);
  parts.push([personalScore,w.personal_rating]);
  const sumW=parts.reduce((a,[_,ww])=>a+ww,0);
  if(sumW===0) return null;
  return Math.round(parts.reduce((a,[v,ww])=>a+v*ww,0)/sumW);
}
function scoreClass(s){ if(s==null) return ''; if(s>=75) return 'high'; if(s>=50) return 'mid'; return 'low'; }

/* ============ Rendering ============ */
function setView(view){
  state.currentView=view;
  document.querySelectorAll('.nav-item').forEach(btn=>btn.classList.toggle('active',btn.dataset.view===view));
  render(); window.scrollTo({top:0,behavior:'smooth'});
}
let renderScheduled=false;
function render(){
  const main=document.getElementById('main');
  if(state.currentView!=='map' && state.mapInstance){
    try{ state.mapInstance.remove(); }catch(e){}
    state.mapInstance=null;
  }
  switch(state.currentView){
    case 'dashboard': main.innerHTML=renderDashboard(); break;
    case 'properties': main.innerHTML=renderProperties(); break;
    case 'add': main.innerHTML=renderAddView(); break;
    case 'compare': main.innerHTML=renderCompare(); break;
    case 'detail': main.innerHTML=renderDetail(); break;
    case 'search': main.innerHTML=renderSearchView(); break;
    case 'map': main.innerHTML=renderMapView(); requestAnimationFrame(initMap); break;
    case 'history': main.innerHTML=renderHistoryView(); break;
    case 'collections': main.innerHTML=renderCollectionsView(); break;
    case 'settings': main.innerHTML=renderSettings(); break;
    default: main.innerHTML=renderDashboard();
  }
  document.getElementById('lastUpdated').textContent=new Date().toLocaleString('de-DE');
  attachHandlers();
  setTimeout(()=>{
    const p = state.properties.find(x=>x.id===state.currentId);
    if(state.currentView==='detail' && p){
      const c=document.getElementById('detailChart');
      if(c) drawChart(c,p.price_history||[]);
    }
    if(state.currentView==='history'){
      const hp = state.properties.find(x=>x.id===state.historyProperty) || state.properties.filter(p=>(p.price_history||[]).length>0)[0];
      const c=document.getElementById('detailChart');
      if(c && hp) drawChart(c,hp.price_history||[]);
    }
  },30);
  if(!renderScheduled){
    renderScheduled=true;
    setTimeout(async ()=>{
      renderScheduled=false;
      const missing=state.properties.filter(p=>!imageCache.has(p.id));
      if(missing.length===0) return;
      await Promise.all(missing.map(p=>loadImages(p.id)));
      render();
    },20);
  }
}

  document.querySelectorAll('.nav-item').forEach(btn=>{ btn.onclick=()=>setView(btn.dataset.view); });

function applyFilters(list){
  const f=state.filters;
  return list.filter(p=>{
    if(f.search){
      const q=f.search.toLowerCase();
      const hay=[p.name,p.city,p.country,p.region,p.description].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(f.country&&p.country!==f.country) return false;
    if(f.type&&p.property_type!==f.type) return false;
    if(f.mealPlan&&p.meal_plan!==f.mealPlan) return false;
    if(f.maxPrice&&(p.base_price==null||p.base_price>Number(f.maxPrice))) return false;
    if(f.spaOnly&&!p.spa) return false;
    if(f.favoriteOnly&&!p.is_favorite) return false;
    if(f.collection&&!(p.collections||[]).includes(f.collection)) return false;
    return true;
  });
}
function updateFilter(k,v){ state.filters[k]=v; render(); }
function resetFilters(){ state.filters={search:'',country:'',type:'',mealPlan:'',maxPrice:'',spaOnly:false,favoriteOnly:false,collection:''}; render(); }

function updateNightsReadout(form){
  const ci=form.booking_checkin?.value, co=form.booking_checkout?.value;
  const out=document.getElementById('nightsReadout');
  if(!out) return;
  const n=nightsBetween(ci,co);

/* ============ Import ============ */
function detectProvider(url){
  try{
    const u=new URL(url), h=u.hostname;
    if(h.includes('booking.com')) return 'booking';
    if(h.includes('airbnb.')) return 'airbnb';
    if(h.includes('escapio.')) return 'escapio';
    if(h.includes('simplebooking.it')) return 'simplebooking';
    if(h.includes('onepagebooking.com')) return 'onepagebooking';
    if(h.includes('huettenland.com')) return 'huettenland';
    return 'official';
  }catch{ return 'unknown'; }
}
function canonicalize(url,provider){
  try{
    const u=new URL(url);
    ['utm_source','utm_medium','utm_campaign','utm_term','utm_content','gclid','fbclid','ref','aid',
     'checkin','checkout','group_adults','group_children','no_rooms','selected_currency','lang',
     'check_in','check_out','adults','children','guests','in','out','currency'].forEach(p=>u.searchParams.delete(p));
    u.hash='';
    let out=u.toString();
    if(out.endsWith('/')&&u.pathname!=='/') out=out.slice(0,-1);
    return out;
  }catch{ return null; }
}
function isSafeUrl(raw){
  try{
    const u=new URL(raw);
    if(!['http:','https:'].includes(u.protocol)) return false;
    const h=u.hostname.toLowerCase();
    if(['localhost','127.0.0.1','0.0.0.0','169.254.169.254','metadata.google.internal'].includes(h)) return false;
    if(h.startsWith('10.')||h.startsWith('192.168.')) return false;
    if(/^172\.(1[6-9]|2\d|3[01])\./.test(h)) return false;
    if(h.endsWith('.internal')) return false;
    return true;
  }catch{ return false; }
}
function findDuplicate(url){
  const c=canonicalize(url,detectProvider(url));
  return state.properties.find(p=>{
    if(!p.url) return false;
    const pc=canonicalize(p.url,p.provider||detectProvider(p.url));
    return c&&pc&&c===pc;
  });
}
function importSingleUrl(form){
  const url=form.url.value.trim();
  if(!url) return;
  if(!isSafeUrl(url)){ toast('Unzulässige URL'); return; }
  const dup=findDuplicate(url);
  const prog=document.getElementById('importProgress');
  if(dup){
    prog.innerHTML=`<div class="import-row"><span class="status duplicate">Duplikat</span><span class="url">${escapeHtml(url)}</span><span>→ ${escapeHtml(dup.name)}</span></div>`;
    return;
  }
  const provider=detectProvider(url);
  prog.innerHTML=`<div class="import-row"><span class="status pending">Lädt…</span><span class="url">${escapeHtml(url)}</span></div>`;
  setTimeout(()=>{
    const name=extractNameFromUrl(url);
    const p={
      id:uid(), name, property_type:'other', country:null, city:null, region:null,
      url, provider, description:null, meal_plan:'unknown', dinner_score:null, dinner_notes:null,
      spa:false, spa_area_sqm:null, sauna_types:[], amenities:[], price_note:null,
      base_price:null, booking_checkin:null, booking_checkout:null,
      personal_rating:null, notes:null, is_favorite:false, collections:[], image_urls:[],
      created_at:new Date().toISOString().slice(0,10), price_history:[]
    };
    state.properties.unshift(p); save();
    prog.innerHTML=`<div class="import-row"><span class="status success">Erfolg</span><span class="url">${escapeHtml(url)}</span><span>→ ${escapeHtml(name)}</span></div>`;
    toast('Unterkunft importiert');
    setTimeout(()=>setView('properties'),800);
  },400);
}
function importBatch(form){
  const urls=form.urls.value.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!urls.length) return;
  const prog=document.getElementById('importProgress');
  prog.innerHTML='';
  let done=0;
  urls.forEach((url,i)=>{
    setTimeout(()=>{
      if(!isSafeUrl(url)){
        prog.innerHTML+=`<div class="import-row"><span class="status failed">Ungültig</span><span class="url">${escapeHtml(url)}</span></div>`;
        done++; return;
      }
      const dup=findDuplicate(url);
      if(dup){
        prog.innerHTML+=`<div class="import-row"><span class="status duplicate">Duplikat</span><span class="url">${escapeHtml(url)}</span><span>→ ${escapeHtml(dup.name)}</span></div>`;
      } else {
        const provider=detectProvider(url);
        const name=extractNameFromUrl(url);
        state.properties.unshift({
          id:uid(), name, property_type:'other', country:null, city:null, region:null,
          url, provider, description:null, meal_plan:'unknown', dinner_score:null, dinner_notes:null,
          spa:false, spa_area_sqm:null, sauna_types:[], amenities:[], price_note:null,
          base_price:null, booking_checkin:null, booking_checkout:null,
          personal_rating:null, notes:null, is_favorite:false, collections:[], image_urls:[],
          created_at:new Date().toISOString().slice(0,10), price_history:[]
        });
        prog.innerHTML+=`<div class="import-row"><span class="status success">Erfolg</span><span class="url">${escapeHtml(url)}</span><span>→ ${escapeHtml(name)}</span></div>`;
      }
      done++;
      if(done===urls.length){
        save(); toast(`${urls.length} URLs verarbeitet`);
        setTimeout(()=>setView('properties'),1000);
      }
    },i*250);
  });
}
function extractNameFromUrl(url){
  try{
    const u=new URL(url);
    let seg=u.pathname.split('/').filter(Boolean).pop()||u.hostname;
    seg=seg.replace(/\.(html?|php|aspx?)$/i,'').replace(/[-_]+/g,' ');
    seg=seg.split(' ').map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ');
    return seg||u.hostname;
  }catch{ return 'Unterkunft'; }
}

          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" onclick="closeModal()">Abbrechen</button>
            <button type="submit" class="btn btn-primary">Speichern</button>

          ${renderImageUpload(p.id)}

  if(!imageCache.has(p.id)) loadImages(p.id).then(()=>{});
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
function saveEdit(id,form){
  const p=state.properties.find(x=>x.id===id);
  if(!p) return;
  const fd=new FormData(form);
  const oldPrice=p.base_price;
  const ci=(fd.get('booking_checkin')||'').toString().trim()||null;
  const co=(fd.get('booking_checkout')||'').toString().trim()||null;
  if(ci&&co&&nightsBetween(ci,co)==null){ toast('Abreise muss nach Anreise liegen'); return; }
  p.name=(fd.get('name')||'').toString().trim();
  p.property_type=(fd.get('property_type')||'other').toString();
  p.meal_plan=(fd.get('meal_plan')||'unknown').toString();
  p.country=(fd.get('country')||'').toString().trim()||null;
  p.city=(fd.get('city')||'').toString().trim()||null;
  p.base_price=fd.get('base_price')?Number(fd.get('base_price')):null;
  p.booking_checkin=ci; p.booking_checkout=co;
  p.dinner_score=fd.get('dinner_score')?Number(fd.get('dinner_score')):null;
  p.sauna_types=(fd.get('sauna_types')||'').toString().split(',').map(s=>s.trim()).filter(Boolean);
  p.url=(fd.get('url')||'').toString().trim()||null;
  p.description=(fd.get('description')||'').toString().trim()||null;
  p.dinner_notes=(fd.get('dinner_notes')||'').toString().trim()||null;
  p.price_note=(fd.get('price_note')||'').toString().trim()||null;
  p.spa=fd.get('spa')==='on';
  if(p.base_price!=null && p.base_price!==oldPrice){
    if(!p.price_history) p.price_history=[];
    p.price_history.push({price:p.base_price,date:new Date().toISOString().slice(0,10)});
  }
  save(); closeModal(); toast('Gespeichert'); render();
}

/* ============ Compare View ============ */
function renderCompare(){
  const props=state.properties;
  if(!props.length) return `<div class="empty-state"><h3>Keine Unterkünfte zum Vergleichen</h3></div>`;
  const selected=state.compareSelection.map(id=>props.find(p=>p.id===id)).filter(Boolean);
  const sorted=[...props].sort(sortFn);
  const ctx=state.compareContext;
  const ctxNights=nightsBetween(ctx.checkIn,ctx.checkOut);
  const withPrice=props.filter(p=>p.base_price!=null&&totalForProperty(p)!=null);
  const avgTotal=withPrice.length?withPrice.reduce((a,p)=>a+(totalForProperty(p)||0),0)/withPrice.length:null;
  const cheapestTotal=[...withPrice].map(p=>({p,t:totalForProperty(p)})).filter(x=>x.t!=null).sort((a,b)=>a.t-b.t)[0];
  return `
    <div class="page-header">
      <div class="page-title"><small>Vergleich</small><h1>Unterkünfte vergleichen</h1></div>

      <div class="ctx-field"><label>Abreise (Kontext)</label><input type="date" value="${ctx.checkOut}" onchange="updateCompareContext('checkOut',this.value)" /></div>
      <div class="ctx-field"><label>Nächte (auto)</label><input type="text" readonly value="${ctxNights!=null?ctxNights+(ctxNights===1?' Nacht':' Nächte'):'—'}" /></div>
      <div class="ctx-field"><label>Erwachsene</label><input type="number" min="1" max="20" value="${ctx.adults||2}" onchange="updateCompareContext('adults',this.value)" /></div>
      <label class="ctx-toggle">
        <input type="checkbox" ${ctx.usePropertyValues?'checked':''} onchange="updateCompareContext('usePropertyValues',this.checked)" />

      </label>
      <div class="ctx-summary">
        ${cheapestTotal?`<div><strong>Günstigster Gesamtpreis:</strong> ${fmtPrice(cheapestTotal.t)}<br><span style="font-size:0.75rem">${escapeHtml(cheapestTotal.p.name)}</span></div>`:''}
        ${avgTotal!=null?`<div style="margin-top:0.3rem"><strong>Ø Gesamtpreis:</strong> ${fmtPrice(avgTotal)}</div>`:''}
      </div>
    </div>
    <div class="compare-selector no-print">
      <div style="width:100%;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-dim);font-weight:600;margin-bottom:0.4rem">Für Detailvergleich (${selected.length}/5)</div>
      ${props.map(p=>`<div class="compare-chip ${state.compareSelection.includes(p.id)?'selected':''}" onclick="toggleCompare('${p.id}')">${escapeHtml(p.name)}</div>`).join('')}
    </div>
    ${selected.length>=2?`
      <h2 style="font-size:1.3rem;margin-bottom:1rem">Detailvergleich</h2>
      <div class="table-wrap" style="margin-bottom:2.5rem">
        <table><thead><tr><th>Merkmal</th>${selected.map(p=>`<th>${escapeHtml(p.name)}</th>`).join('')}</tr></thead>
        <tbody>
          ${compareRow('Ort',selected,p=>[p.city,p.country].filter(Boolean).join(', '))}
          ${compareRow('Typ',selected,p=>typeLabel(p.property_type))}
          ${compareRow('Verpflegung',selected,p=>mealLabel(p.meal_plan))}
          ${compareRow('Anreise',selected,p=>{const b=effectiveBooking(p);return b.checkin?fmtDateShort(b.checkin):'—';})}
          ${compareRow('Abreise',selected,p=>{const b=effectiveBooking(p);return b.checkout?fmtDateShort(b.checkout):'—';})}
          ${compareRow('Nächte',selected,p=>{const b=effectiveBooking(p);return b.nights!=null?String(b.nights):'—';})}
          ${compareRow('Preis/Nacht',selected,p=>p.base_price?fmtPrice(p.base_price):'—')}
          ${compareRow('Gesamtpreis',selected,p=>{const t=totalForProperty(p);return t!=null?fmtPrice(t):'—';})}
          ${compareRow('Preis/Person',selected,p=>{const t=totalForProperty(p);const a=state.compareContext.adults||2;return t!=null&&a>0?fmtPrice(t/a):'—';})}
          ${compareRow('Dinner-Score',selected,p=>p.dinner_score?p.dinner_score+' / 5':'—')}
          ${compareRow('Spa',selected,p=>p.spa?'Ja':'Nein')}
          ${compareRow('Saunaarten',selected,p=>(p.sauna_types||[]).join(', ')||'—')}
          ${compareRow('Gesamtscore',selected,p=>{const s=computeScore(p);return s!=null?String(s):'—';})}
        </tbody></table>
      </div>`:''}
    <h2 style="font-size:1.3rem;margin-bottom:1rem">Alle Unterkünfte</h2>
    <div class="table-wrap">
      <table><thead><tr>
        ${th('name','Name')}${th('city','Ort')}${th('property_type','Typ')}${th('meal_plan','Verpflegung')}

        ${th('dinner_score','Dinner')}${th('spa','Spa')}<th>Score</th>
      </tr></thead><tbody>
        ${sorted.map(p=>{
          const b=effectiveBooking(p);
          const t=totalForProperty(p);
          return `<tr onclick="openDetail('${p.id}')" style="cursor:pointer">
            <td><strong>${escapeHtml(p.name)}</strong></td>
            <td>${escapeHtml([p.city,p.country].filter(Boolean).join(', '))}</td>
            <td>${escapeHtml(typeLabel(p.property_type))}</td>
            <td>${escapeHtml(mealLabel(p.meal_plan))}</td>
            <td>${b.checkin?fmtDateShort(b.checkin):'—'}</td>
            <td>${b.checkout?fmtDateShort(b.checkout):'—'}</td>
            <td>${b.nights!=null?`<span class="nights-badge">${b.nights}</span>`:'—'}</td>
            <td>${p.base_price?fmtPrice(p.base_price):'—'}</td>
            <td class="total-cell">${t!=null?fmtPrice(t):'—'}</td>
            <td>${p.dinner_score?p.dinner_score+'/5':'—'}</td>

            <td><strong style="color:var(--forest-700)">${computeScore(p)??'—'}</strong></td>
          </tr>`;
        }).join('')}
      </tbody></table>
    </div>
  `;
}
function updateCompareContext(key,value){
  if(key==='adults'){
    const n=Number(value);
    if(isNaN(n)||n<1){ toast('Ungültiger Wert'); return; }
    state.compareContext[key]=n;
  } else if(key==='usePropertyValues'){
    state.compareContext.usePropertyValues=value;
  } else {
    state.compareContext[key]=value||'';
  }
  save(); render();
}
function compareRow(label,items,fn){
  return `<tr><td><strong>${label}</strong></td>${items.map(p=>`<td>${escapeHtml(fn(p))}</td>`).join('')}</tr>`;
}
function th(col,label){
  const active=state.sort.column===col;
  const arrow=active?(state.sort.direction==='asc'?'▲':'▼'):'';
  return `<th onclick="sortBy('${col}')">${label}<span class="sort-arrow">${arrow}</span></th>`;
}
function sortBy(col){
  if(state.sort.column===col) state.sort.direction=state.sort.direction==='asc'?'desc':'asc';
  else { state.sort.column=col; state.sort.direction='asc'; }
  render();
}
function sortFn(a,b){
  const col=state.sort.column, dir=state.sort.direction==='asc'?1:-1;
  let av=a[col], bv=b[col];
  if(col==='spa'){ av=a.spa?1:0; bv=b.spa?1:0; }
  if(av==null&&bv==null) return 0;
  if(av==null) return 1;
  if(bv==null) return -1;
  if(typeof av==='string') return av.localeCompare(bv)*dir;
  return (av-bv)*dir;
}
function toggleCompare(id){
  const i=state.compareSelection.indexOf(id);
  if(i>=0) state.compareSelection.splice(i,1);
  else {
    if(state.compareSelection.length>=5){ toast('Maximal 5 vergleichbar'); return; }
    state.compareSelection.push(id);
  }
  render();
}

function updateSearchNightsReadout(form){
  const ci=form.checkIn?.value, co=form.checkOut?.value;
  const out=document.getElementById('searchNightsReadout');
  if(!out) return;
  const n=nightsBetween(ci,co);
  out.value=n!=null?`${n} ${n===1?'Nacht':'Nächte'}`:'—';
}
function runSearch(form){
  const fd=new FormData(form);
  const checkIn=fd.get('checkIn'), checkOut=fd.get('checkOut');
  const adults=Number(fd.get('adults')), children=Number(fd.get('children')), rooms=Number(fd.get('rooms'));
  const maxBudget=fd.get('maxBudget')?Number(fd.get('maxBudget')):null;
  if(!checkIn||!checkOut){ toast('Datum erforderlich'); return; }
  const nights=nightsBetween(checkIn,checkOut);
  if(nights==null){ toast('Abreise muss nach Anreise liegen'); return; }
  if(adults<1){ toast('Mindestens 1 Erwachsener'); return; }
  const results=state.properties.map(p=>{
    const base=p.base_price;
    const persons=adults+children*0.5;
    const total=base!=null?Math.round(base*nights*(persons/2)*100)/100:null;
    return {
      property:p, nights, adults, children, rooms,
      total_price:total, nightly:base,
      per_person:total!=null&&adults>0?Math.round((total/(adults+children))*100)/100:null,
      available:base!=null, checked_at:new Date().toISOString(), currency:'EUR', is_estimate:base!=null,
      source:'Manuell gepflegter Preis'
    };
  });
  state.lastSearch={checkIn,checkOut,nights,adults,children,rooms,maxBudget,results,timestamp:new Date().toISOString()};
  state.compareContext.checkIn=checkIn; state.compareContext.checkOut=checkOut; state.compareContext.adults=adults;
  save(); render();
}
function renderSearchResults(){
  const s=state.lastSearch;
  const results=s.results.filter(r=>r.available&&(s.maxBudget==null||r.total_price<=s.maxBudget));
  results.sort((a,b)=>(a.total_price||Infinity)-(b.total_price||Infinity));
  const cheapest=results[0];
  const cheapestHB=results.filter(r=>r.property.meal_plan==='half_board')[0];
  const cheapestFB=results.filter(r=>r.property.meal_plan==='breakfast')[0];
  return `
    <h2 style="font-size:1.3rem;margin-bottom:1rem">Ergebnisse</h2>
    <div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:1.5rem">
      ${fmtDate(s.checkIn)} → ${fmtDate(s.checkOut)} · ${s.nights} Nächte · ${s.adults} Erw.${s.children?', '+s.children+' Kinder':''} · ${s.rooms} Zimmer
      ${s.maxBudget?' · Budget max. '+fmtPrice(s.maxBudget):''}
    </div>
    <div class="stats-grid" style="margin-bottom:2rem">
      ${cheapest?`<div class="stat-card" style="border-left:3px solid var(--brass-400)">
        <div class="stat-label">Günstigstes Angebot</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--forest-800);margin:0.25rem 0">${escapeHtml(cheapest.property.name)}</div>
        <div class="stat-sub">${fmtPrice(cheapest.total_price)} gesamt · ${fmtPrice(cheapest.per_person)}/Person</div>
      </div>`:''}
      ${cheapestFB?`<div class="stat-card" style="border-left:3px solid var(--info)">
        <div class="stat-label">Günstigstes mit Frühstück</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--forest-800);margin:0.25rem 0">${escapeHtml(cheapestFB.property.name)}</div>
        <div class="stat-sub">${fmtPrice(cheapestFB.total_price)} gesamt</div>
      </div>`:''}
      ${cheapestHB?`<div class="stat-card" style="border-left:3px solid var(--forest-500)">
        <div class="stat-label">Günstigstes mit Halbpension</div>
        <div style="font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--forest-800);margin:0.25rem 0">${escapeHtml(cheapestHB.property.name)}</div>
        <div class="stat-sub">${fmtPrice(cheapestHB.total_price)} gesamt</div>
      </div>`:''}
    </div>
    <div class="table-wrap">
      <table><thead><tr>
        <th>Unterkunft</th><th>Ort</th><th>Verpflegung</th><th>Gesamt</th><th>Nacht</th><th>Pro Person</th><th>Status</th>
      </tr></thead><tbody>
        ${results.map(r=>`<tr onclick="openDetail('${r.property.id}')" style="cursor:pointer">
          <td><strong>${escapeHtml(r.property.name)}</strong></td>

          <td>${escapeHtml(mealLabel(r.property.meal_plan))}</td>
          <td class="total-cell">${fmtPrice(r.total_price)}</td>
          <td>${fmtPrice(r.nightly)}</td>
          <td>${fmtPrice(r.per_person)}</td>
          <td><span style="background:var(--sand-100);color:var(--taupe-600);padding:0.15rem 0.6rem;border-radius:20px;font-size:0.65rem;font-weight:600;text-transform:uppercase">Schätzung</span></td>

function initMap(){
  const el=document.getElementById('map');
  if(!el||typeof L==='undefined') return;
  if(state.mapInstance){ try{ state.mapInstance.remove(); }catch(e){} }
  state.mapInstance=L.map('map').setView([50,10],4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(state.mapInstance);
  const bounds=[];
  state.properties.forEach(p=>{
    const c=COORDS[p.id];
    if(!c) return;
    bounds.push(c);
    const images=imageCache.get(p.id)||[];
    const thumb=images[0]?`<img src="${images[0].url}" style="width:100%;height:80px;object-fit:cover;border-radius:4px;margin-bottom:0.4rem" />`:'';
    const marker=L.marker(c).addTo(state.mapInstance);
    const b=effectiveBooking(p);
    const total=totalForProperty(p);
    marker.bindPopup(`
      <div style="font-family:'Inter',sans-serif;min-width:200px">
        ${thumb}
        <div style="font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:600;margin-bottom:0.3rem">${escapeHtml(p.name)}</div>
        <div style="font-size:0.8rem;color:#786b5e;margin-bottom:0.5rem">${escapeHtml([p.city,p.country].filter(Boolean).join(', '))}</div>
        ${p.base_price?`<div style="font-weight:600">${fmtPrice(p.base_price)} / Nacht</div>`:''}
        ${b.checkin&&b.checkout?`<div style="font-size:0.8rem">${fmtDateShort(b.checkin)} → ${fmtDateShort(b.checkout)} (${b.nights} ${b.nights===1?'Nacht':'Nächte'})</div>`:''}
        ${total!=null?`<div style="font-weight:600;color:#254e3f">Gesamt: ${fmtPrice(total)}</div>`:''}
        <button onclick="openDetail('${p.id}')" style="margin-top:0.5rem;padding:0.3rem 0.7rem;font-size:0.75rem;border-radius:4px;background:#254e3f;color:white;border:none;cursor:pointer">Details</button>
      </div>`);
  });
  if(bounds.length) state.mapInstance.fitBounds(bounds,{padding:[40,40],maxZoom:8});
}

              <td>${h.length}</td>
              <td>${fmtPrice(last)}</td>
              <td>${fmtPrice(first)}</td>
              <td style="color:${delta<0?'var(--success)':delta>0?'var(--danger)':'inherit'}">${delta<0?'▼':'▲'} ${fmtPrice(Math.abs(delta))}</td>
              <td style="font-size:0.8rem;color:var(--text-dim)">${fmtDate(h[0].date)} – ${fmtDate(h[h.length-1].date)}</td>
            </tr>`;
          }).join('')}
        </tbody></table>
      </div>
    `}
  `;
}
function renderHistoryChart(propsWithHistory){
  if(!state.historyProperty&&propsWithHistory.length) state.historyProperty=propsWithHistory[0].id;
  const p=propsWithHistory.find(x=>x.id===state.historyProperty)||propsWithHistory[0];
  if(!p) return '';
  return `<h3 style="margin-bottom:0.75rem;font-size:1.1rem">${escapeHtml(p.name)}</h3><canvas id="detailChart" class="chart"></canvas>`;
}

/* ============ Chart ============ */
function drawChart(canvas,history){
  if(!canvas||!history||history.length<2) return;
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.getBoundingClientRect();
  canvas.width=rect.width*dpr; canvas.height=rect.height*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  const W=rect.width, H=rect.height;
  const pad={top:20,right:20,bottom:30,left:55};
  const innerW=W-pad.left-pad.right, innerH=H-pad.top-pad.bottom;
  const prices=history.map(h=>h.price);
  const min=Math.min(...prices), max=Math.max(...prices);
  const range=max-min||1;
  const stepX=innerW/(history.length-1);
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--sand-200')||'#e0d3bd';
  ctx.lineWidth=1;
  for(let i=0;i<=4;i++){
    const y=pad.top+(innerH*i/4);
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+innerW,y); ctx.stroke();
    ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text-dim')||'#786b5e';
    ctx.font='11px Inter, sans-serif'; ctx.textAlign='right';
    const val=max-(range*i/4);
    ctx.fillText(Math.round(val)+'€',pad.left-8,y+4);
  }
  ctx.beginPath();
  history.forEach((h,i)=>{
    const x=pad.left+stepX*i;
    const y=pad.top+innerH-((h.price-min)/range)*innerH;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.lineTo(pad.left+innerW,pad.top+innerH); ctx.lineTo(pad.left,pad.top+innerH); ctx.closePath();
  ctx.fillStyle='rgba(63,124,99,0.15)'; ctx.fill();
  ctx.beginPath();
  history.forEach((h,i)=>{
    const x=pad.left+stepX*i;
    const y=pad.top+innerH-((h.price-min)/range)*innerH;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#254e3f'; ctx.lineWidth=2; ctx.stroke();
  history.forEach((h,i)=>{
    const x=pad.left+stepX*i;
    const y=pad.top+innerH-((h.price-min)/range)*innerH;
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fillStyle='#cba94f'; ctx.fill();
    ctx.strokeStyle='#254e3f'; ctx.lineWidth=1.5; ctx.stroke();
  });
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--text-dim')||'#786b5e';
  ctx.font='11px Inter, sans-serif'; ctx.textAlign='center';
  [0,Math.floor(history.length/2),history.length-1].forEach(i=>{
    const x=pad.left+stepX*i;
    const d=new Date(history[i].date);
    ctx.fillText(d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}),x,H-8);
  });
}

/* ============ Collections View ============ */
function renderCollectionsView(){
  const c=state.collections;
  return `
    <div class="page-header">
      <div class="page-title"><small>Sammlungen</small><h1>Favoriten & Sammlungen</h1></div>
      <button class="btn btn-primary" onclick="promptNewCollection()">+ Neue Sammlung</button>
    </div>
    ${c.length===0?`<div class="empty-state"><h3>Noch keine Sammlungen</h3><p>Erstelle Sammlungen wie „Wellness-Wochenende" oder „Gourmet-Hotels".</p><button class="btn btn-primary" onclick="promptNewCollection()">Erste Sammlung anlegen</button></div>`:`
      ${c.map(name=>{
        const items=state.properties.filter(p=>(p.collections||[]).includes(name));
        return `
          <div style="margin-bottom:2.5rem">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
              <h2 style="font-size:1.3rem">${escapeHtml(name)} <span style="font-size:0.9rem;color:var(--text-dim);font-family:Inter">(${items.length})</span></h2>
              <button class="btn btn-ghost btn-sm" onclick="deleteCollection('${escapeHtml(name)}')">Löschen</button>
            </div>
            ${items.length===0?`<p style="color:var(--text-dim);font-size:0.9rem">Keine Unterkünfte in dieser Sammlung.</p>`
              :`<div class="properties-grid">${items.map(renderPropertyCard).join('')}</div>`}
          </div>`;
      }).join('')}
    `}
  `;
}

/* ============ Settings ============ */
function renderSettings(){
  const w=state.settings.weights;
  const total=w.price_value+w.dinner_quality+w.spa_wellness+w.property_quality+w.personal_rating;
  const ctxNights=nightsBetween(state.compareContext.checkIn,state.compareContext.checkOut);
  return `
    <div class="page-header"><div class="page-title"><small>Einstellungen</small><h1>Konfiguration</h1></div></div>
    <div class="card" style="padding:2rem;max-width:640px;margin-bottom:1.5rem">
      <h3 style="margin-bottom:1.25rem;font-size:1.1rem">Bewertungsgewichtung</h3>
      <p style="font-size:0.85rem;color:var(--text-dim);margin-bottom:1.5rem">Summe: <strong style="color:${total===100?'var(--success)':'var(--warning)'}">${total} %</strong>${total!==100?' (wird normalisiert)':''}</p>
      ${weightSlider('price_value','Preis-Leistung',w.price_value)}
      ${weightSlider('dinner_quality','Dinner-Qualität',w.dinner_quality)}
      ${weightSlider('spa_wellness','Spa & Wellness',w.spa_wellness)}
      ${weightSlider('property_quality','Unterkunftsqualität',w.property_quality)}
      ${weightSlider('personal_rating','Persönliche Bewertung',w.personal_rating)}
    </div>
    <div class="card" style="padding:2rem;max-width:640px;margin-bottom:1.5rem">
      <h3 style="margin-bottom:1.25rem;font-size:1.1rem">Standard-Vergleichszeitraum</h3>
      <div class="form-row">
        <div class="form-group"><label>Standard-Anreise</label><input type="date" value="${state.compareContext.checkIn||''}" onchange="updateCompareContext('checkIn',this.value)" /></div>
        <div class="form-group"><label>Standard-Abreise</label><input type="date" value="${state.compareContext.checkOut||''}" onchange="updateCompareContext('checkOut',this.value)" /></div>
      </div>
      <div class="form-group"><label>Nächte (auto)</label><input type="text" readonly value="${ctxNights!=null?ctxNights+(ctxNights===1?' Nacht':' Nächte'):'—'}" /></div>
      <div class="form-group">
        <label style="display:flex;align-items:center;gap:0.5rem;text-transform:none;letter-spacing:0"><input type="checkbox" ${state.compareContext.usePropertyValues?'checked':''} onchange="updateCompareContext('usePropertyValues',this.checked)" /> Eigene Werte pro Unterkunft bevorzugen</label>
      </div>
    </div>
    <div class="card" style="padding:2rem;max-width:640px;margin-bottom:1.5rem">
      <h3 style="margin-bottom:1.25rem;font-size:1.1rem">Daten</h3>
      <div style="display:flex;gap:0.75rem;flex-wrap:wrap">
        <button class="btn btn-secondary" onclick="exportData()">Daten exportieren (JSON)</button>
        <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">Daten importieren</button>
        <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)" />
        <button class="btn btn-secondary" onclick="printReport()">PDF-Bericht drucken</button>
        <button class="btn btn-danger" onclick="resetData()">Auf Seed-Daten zurücksetzen</button>
      </div>
      <p style="font-size:0.8rem;color:var(--text-dim);margin-top:1rem">
        <strong>Bilder</strong> werden in IndexedDB gespeichert und sind <em>nicht</em> im JSON-Export enthalten.
        Bei „Zurücksetzen" werden auch alle Bilder gelöscht.
      </p>
    </div>
  `;
}
function weightSlider(key,label,value){
  return `<div style="margin-bottom:1rem">
    <div style="display:flex;justify-content:space-between;margin-bottom:0.35rem">
      <label style="font-size:0.85rem;color:var(--text)">${label}</label>
      <span id="w-${key}" style="font-weight:600;color:var(--forest-700);font-size:0.85rem">${value} %</span>
    </div>
    <input type="range" min="0" max="100" value="${value}" oninput="updateWeight('${key}',this.value)" style="width:100%;accent-color:var(--forest-700)" />
  </div>`;
}
function updateWeight(key,value){
  state.settings.weights[key]=Number(value);
  document.getElementById('w-'+key).textContent=value+' %';
  saveSettings();
}

/* ============ Import/Export ============ */
function exportData(){
  const data={
    properties:state.properties, collections:state.collections, settings:state.settings,
    compareContext:state.compareContext, exportedAt:new Date().toISOString(), version:'v5'
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='stayselect-export-'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(url);
  toast('Export heruntergeladen (Bilder nicht enthalten)');
}
function importData(event){
  const file=event.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      if(Array.isArray(data.properties)){
        if(confirm(`${data.properties.length} Unterkünfte importieren? Bestehende werden ersetzt. Bilder bleiben im Browser.`)){
          state.properties=data.properties.map(migrateProperty);
          if(Array.isArray(data.collections)) state.collections=data.collections;
          if(data.settings) state.settings={...DEFAULT_SETTINGS,...data.settings};
          if(data.compareContext){ state.compareContext={...state.compareContext,...data.compareContext}; if(state.compareContext.nights) delete state.compareContext.nights; }
          save(); saveSettings(); applyTheme();
          toast('Import erfolgreich');
          render();
        }
      } else toast('Ungültiges Format');
    }catch(err){ toast('Import fehlgeschlagen: '+err.message); }
    event.target.value='';
  };
  reader.readAsText(file);
}
async function resetData(){
  if(!confirm('Alle Daten zurücksetzen? Auch alle hochgeladenen Bilder werden gelöscht.')) return;
  try{
    for(const p of state.properties) await imgDB.delByProperty(p.id);
  }catch(e){}
  clearAllImageCache();
  state.properties=JSON.parse(JSON.stringify(SEED_PROPERTIES)).map(migrateProperty);
  state.settings={...DEFAULT_SETTINGS};
  state.collections=[];
  state.compareSelection=[];
  state.lastSearch=null;
  state.searchContext=null;
  state.compareContext={checkIn:'',checkOut:'',usePropertyValues:false,adults:2};
  state.galleryIndex={};
  save(); saveSettings(); applyTheme();
  toast('Zurückgesetzt');
  setView('dashboard');
}
function printReport(){ window.print(); }

/* ============ Init ============ */
load();
document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>setView(btn.dataset.view));
});
render();
</script>
